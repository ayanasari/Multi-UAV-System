[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uavfl"
version = "0.1.0"
description = "Distributed multi-UAV path planning with federated reinforcement learning (Flower)"
requires-python = ">=3.11"
dependencies = ["flwr[simulation]>=1.37", "torch>=2.2", "numpy", "matplotlib", "pillow"]

[tool.hatch.build.targets.wheel]
packages = ["uavfl"]

[tool.flwr.app]
publisher = "ayan"

[tool.flwr.app.components]
serverapp = "uavfl.server_app:app"
clientapp = "uavfl.client_app:app"

[tool.flwr.app.config]
name = "fedavg"
num-server-rounds = 40
num-uavs = 5
fraction-train = 1.0
local-episodes = 20
local-steps = 500
learning-rate = 0.0005
prox-mu = 0.0
non-iid = true
seed = 0
out = "results/fedavg.json"


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
